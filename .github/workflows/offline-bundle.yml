# 폐쇄망 반입 파일을 GitHub Releases에 올린다(Actions 탭 > offline-bundle > Run workflow).
# 2GB 자산 제한 때문에 큰 파일은 1900MB 조각으로 나누고, 폐쇄망에서 docker/install_bundle.sh로 합친다.
name: offline-bundle

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 릴리스 태그
        default: offline-v0.1.1
      encoder:
        description: 인코더(허깅페이스 저장소)
        default: BAAI/bge-m3
      llm:
        description: 번역 LLM(비우면 생략)
        default: ""
      vscode_commit:
        description: "VS Code Server 오프라인 설치용 커밋(VS Code 도움말 > 정보의 커밋). 비우면 생략"
        default: ""
      code_only:
        description: "true면 이미지·모델은 건너뛰고 코드와 install_bundle.sh만 갱신"
        type: boolean
        default: false

permissions:
  contents: write

env:
  IMAGE: mcc:0.1.1
  GH_TOKEN: ${{ github.token }}
  TAG: ${{ inputs.tag }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 디스크 확보
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost
          docker system prune -af
          df -h /

      - name: 릴리스 만들기
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$TAG 폐쇄망 반입 파일" --notes "docker/install_bundle.sh 사용법은 README 참고. 커밋 ${GITHUB_SHA::7}"
          gh release upload "$TAG" docker/install_bundle.sh --clobber

      - name: 코드 업로드
        run: |
          # 폐쇄망에서 저장소 ZIP을 따로 받지 않도록 이 커밋의 코드를 함께 올린다(install_bundle.sh가 /srv/mcc/app에 푼다).
          git archive --format=tar.gz --prefix=mcc-app/ -o mcc-app.tar.gz HEAD
          sha256sum mcc-app.tar.gz > SHA256SUMS.code
          gh release upload "$TAG" mcc-app.tar.gz SHA256SUMS.code --clobber

      - name: VS Code Server
        if: inputs.vscode_commit != ''
        env:
          COMMIT: ${{ inputs.vscode_commit }}
        run: |
          # Remote-SSH가 서버에서 받으려는 두 파일(서버 본체, CLI)을 미리 받아 둔다. install_bundle.sh가 ~/.vscode-server에 푼다.
          if [ "$COMMIT" = latest ]; then COMMIT=$(curl -fsSL https://update.code.visualstudio.com/api/update/server-linux-x64/stable/latest | jq -r .version); fi
          echo "VS Code commit: $COMMIT"
          curl -fsSL -o "vscode-server_$COMMIT.tar.gz" "https://update.code.visualstudio.com/commit:$COMMIT/server-linux-x64/stable"
          curl -fsSL -o "vscode-cli_$COMMIT.tar.gz" "https://update.code.visualstudio.com/commit:$COMMIT/cli-alpine-x64/stable"
          sha256sum vscode-*_"$COMMIT".tar.gz > SHA256SUMS.vscode
          gh release upload "$TAG" vscode-*_"$COMMIT".tar.gz SHA256SUMS.vscode --clobber

      - name: 이미지 빌드
        if: ${{ !inputs.code_only }}
        run: docker build -f docker/Dockerfile --build-arg BASE_IMAGE=mirror.gcr.io/nvidia/cuda:12.4.1-cudnn-runtime-ubuntu22.04 -t "$IMAGE" -t mcc:latest .

      - name: 이미지 업로드
        if: ${{ !inputs.code_only }}
        run: |
          mkdir dist && name=${IMAGE/:/_}.tar.gz
          docker save "$IMAGE" mcc:latest | gzip | split -b 1900M - "dist/$name.part-"
          docker rmi "$IMAGE" mcc:latest && docker builder prune -af
          ( cd dist && sha256sum * > ../SHA256SUMS.image )
          for f in dist/*; do gh release upload "$TAG" "$f" --clobber && rm "$f"; done
          gh release upload "$TAG" SHA256SUMS.image --clobber

      - name: 모델 업로드
        if: ${{ !inputs.code_only }}
        env:
          ENCODER: ${{ inputs.encoder }}
          LLM: ${{ inputs.llm }}
        run: |
          pip install -q huggingface_hub==0.27.0
          python docker/release_model.py "$ENCODER" "$(basename "$ENCODER")" "$TAG"
          if [ -n "$LLM" ]; then python docker/release_model.py "$LLM" "$(basename "$LLM")" "$TAG"; fi
